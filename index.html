    <!-- ==========================================================
         BLOCO RETANGULAR FIXO (topbar + orações)
         ========================================================== -->
    <div class="oracao">

      <div id="topbar">
        <div id="misterio-label"></div>
        <div id="misterio-titulo-label"></div>
        <div id="conta-label"></div>
      </div>

      <div id="oracoes-container"></div>

    </div>

  <!-- ============================================================
       BARRA INFERIOR FIXA
       ============================================================ -->
  <div class="control-panel">

    <div class="control-group">
      <button type="button" id="play-pause" onclick="pauseToggle()">
        <i id="pause-icon" class="fa-solid fa-music"></i>
      </button>

      <button type="button" onclick="pecaAnterior();">
        <i class="fa-solid fa-circle-left"></i>
      </button>

      <button type="button" onclick="pecaSeguinte();">
        <i class="fa-solid fa-circle-right"></i>
      </button>

      <button type="button" id="config-btn" onclick="toggleConfigPanel()" aria-label="Configurações">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>

    <p id="misterio-nome"></p>

    <button type="button" onclick="trocarMisterio('gozosos');">
      <i class="fa-solid fa-face-smile"></i>
    </button>

    <button type="button" onclick="trocarMisterio('luminosos');">
      <i class="fa-solid fa-sun"></i>
    </button>

    <button type="button" onclick="trocarMisterio('dolorosos');">
      <i class="fa-solid fa-heart-crack"></i>
    </button>

    <button type="button" onclick="trocarMisterio('gloriosos');">
      <i class="fa-solid fa-crown"></i>
    </button>

    <button type="button" onclick="toggleDarkMode();">
      <i class="fa-solid fa-circle-half-stroke"></i>
    </button>

  </div>

  <!-- ============================================================
       PAINEL DE CONFIGURAÇÕES
       ============================================================ -->
  <div id="config-overlay" onclick="fecharConfigPanel(event)">
    <div id="config-panel" onclick="event.stopPropagation()">

      <div class="config-header">
        <h2>Configurações</h2>
        <button type="button" onclick="fecharConfigPanel()" aria-label="Fechar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="config-section">
        <label>Tamanho da fonte</label>
        <div class="config-row">
          <button type="button" onclick="diminuirFonte()" aria-label="Diminuir fonte">
            <i class="fa-solid fa-minus"></i>
          </button>
          <span id="font-size-display">100%</span>
          <button type="button" onclick="aumentarFonte()" aria-label="Aumentar fonte">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>

      <div class="config-section">
        <label>Fonte geral (títulos, menus)</label>
        <select id="font-geral-select" onchange="trocarFonteGeral(this.value)">
          <option value="macondo">Macondo Swash Caps (padrão)</option>
          <option value="inter">Inter</option>
          <option value="roboto">Roboto</option>
          <option value="jakarta">Plus Jakarta Sans</option>
          <option value="dmsans">DM Sans</option>
          <option value="worksans">Work Sans</option>
          <option value="outfit">Outfit</option>
          <option value="spacegrotesque">Space Grotesque</option>
          <option value="syne">Syne</option>
          <option value="bricolage">Bricolage Grotesque</option>
          <option value="poppins">Poppins</option>
          <option value="montserrat">Montserrat</option>
          <option value="quicksand">Quicksand</option>
          <option value="raleway">Raleway</option>
          <option value="playfair">Playfair Display</option>
          <option value="fraunces">Fraunces</option>
          <option value="lora">Lora</option>
          <option value="notoserif">Noto Serif</option>
          <option value="cinzel">Cinzel</option>
          <option value="jetbrainsmono">JetBrains Mono</option>
        </select>
      </div>

      <div class="config-section">
        <label>Fonte do texto das orações</label>
        <select id="font-texto-select" onchange="trocarFonteTexto(this.value)">
          <option value="inter">Inter (padrão)</option>
          <option value="macondo">Macondo Swash Caps</option>
          <option value="roboto">Roboto</option>
          <option value="jakarta">Plus Jakarta Sans</option>
          <option value="dmsans">DM Sans</option>
          <option value="worksans">Work Sans</option>
          <option value="outfit">Outfit</option>
          <option value="spacegrotesque">Space Grotesque</option>
          <option value="syne">Syne</option>
          <option value="bricolage">Bricolage Grotesque</option>
          <option value="poppins">Poppins</option>
          <option value="montserrat">Montserrat</option>
          <option value="quicksand">Quicksand</option>
          <option value="raleway">Raleway</option>
          <option value="playfair">Playfair Display</option>
          <option value="fraunces">Fraunces</option>
          <option value="lora">Lora</option>
          <option value="notoserif">Noto Serif</option>
          <option value="cinzel">Cinzel</option>
          <option value="jetbrainsmono">JetBrains Mono</option>
        </select>
      </div>

      <div class="config-section">
        <label>Informações</label>
        <button type="button" class="config-btn-info" onclick="reabrirPopupInicial()">
          <i class="fa-solid fa-circle-info"></i> Avisos e referências
        </button>
      </div>

    </div>
  </div>

  <!-- ============================================================
       POPUP INICIAL (avisos + referências)
       O conteúdo vem de textos_lang — não é duplicado aqui.
       ============================================================ -->
  <div id="popup-inicial" class="popup-overlay">
    <div class="popup-box" onclick="event.stopPropagation()">

      <div class="popup-header">
        <h2>Bem-vindo ao Terço Digital</h2>
        <button type="button" onclick="fecharPopupInicial()" aria-label="Fechar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Abas -->
      <div class="popup-tabs">
        <button type="button" class="popup-tab ativo" onclick="trocarAbaPopup('avisos', this)">
          <i class="fa-solid fa-circle-info"></i> Avisos
        </button>
        <button type="button" class="popup-tab" onclick="trocarAbaPopup('referencias', this)">
          <i class="fa-solid fa-book"></i> Referências
        </button>
      </div>

      <!-- Conteúdo das abas (preenchido via JS com textos_lang) -->
      <div class="popup-content">

        <div class="popup-pane ativo" data-aba="avisos">
          <pre id="popup-avisos-conteudo"></pre>
        </div>

        <div class="popup-pane" data-aba="referencias">
          <pre id="popup-referencias-conteudo"></pre>
        </div>

      </div>

      <!-- Footer -->
      <div class="popup-footer">
        <label class="popup-nao-mostrar">
          <input type="checkbox" id="popup-nao-mostrar-check">
          Não mostrar novamente
        </label>
        <button type="button" class="popup-btn-fechar" onclick="fecharPopupInicial()">
          Entendi
        </button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
